name: clinic-lab
services:
  init-permissions:
    image: busybox:1.37.0
    user: 0:0
    command:
    - sh
    - -c
    - mkdir -p /logs/webapp /logs/nginx /logs/postgres /positions; chown 10001:10001
      /logs/webapp /positions; chown 101:101 /logs/nginx; chown 999:999 /logs/postgres;
      chmod 755 /logs/webapp /logs/nginx /logs/postgres
    volumes:
    - logs:/logs
    - positions:/positions
    network_mode: none
    restart: 'no'
  db:
    restart: unless-stopped
    security_opt: &id001
    - no-new-privileges:true
    image: postgres:16.9
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_env.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?required}
      TZ: Asia/Ho_Chi_Minh
    command:
    - postgres
    - -c
    - logging_collector=on
    - -c
    - log_directory=/logs/postgres
    - -c
    - log_filename=postgres-%Y-%m-%d.log
    - -c
    - log_file_mode=0644
    - -c
    - log_error_verbosity=terse
    - -c
    - log_statement=none
    - -c
    - log_min_error_statement=panic
    - -c
    - timezone=Asia/Ho_Chi_Minh
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./db/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    - logs:/logs
    networks:
    - database
    depends_on:
      init-permissions: &id002
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U postgres -d clinic
      interval: 5s
      timeout: 3s
      retries: 20
  webapp:
    restart: unless-stopped
    security_opt: *id001
    build: ./app
    environment:
      SECRET_KEY: ${SECRET_KEY:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      RECEPTION_PASSWORD: ${RECEPTION_PASSWORD:?required}
      ENABLE_DEMO: ${ENABLE_DEMO:-false}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      init-permissions: *id002
      db:
        condition: service_healthy
    networks:
    - frontend
    - database
    - monitoring
    volumes:
    - logs:/logs
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 10s
      timeout: 5s
      retries: 10
  nginx:
    restart: unless-stopped
    security_opt: *id001
    image: nginxinc/nginx-unprivileged:1.28-alpine
    user: 101:101
    ports:
    - 127.0.0.1:8080:8080
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - logs:/logs
    tmpfs:
    - /tmp
    read_only: true
    cap_drop:
    - ALL
    networks:
    - frontend
    - monitoring
    depends_on:
      init-permissions: *id002
      webapp:
        condition: service_healthy
  pgadmin:
    restart: unless-stopped
    security_opt: *id001
    image: dpage/pgadmin4:9.3
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?required}
    ports:
    - 127.0.0.1:5050:80
    volumes:
    - pgadmin:/var/lib/pgadmin
    networks:
    - database
    - admin
    depends_on:
      db:
        condition: service_healthy
networks:
  frontend: {}
  database:
    internal: true
  monitoring:
    internal: true
  admin: {}
volumes:
  logs: {}
  positions: {}
  pgdata: {}
  pgadmin: {}
  prometheus: {}
  loki: {}
  grafana: {}
