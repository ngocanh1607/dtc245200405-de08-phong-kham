pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 server_tokens off;
 client_max_body_size 16k;
 log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","status":$status,"duration":$request_time}';
 access_log /logs/nginx/access.log json;
 error_log /logs/nginx/error.log warn;
 limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
 upstream clinic { server webapp:8000; }
 server {
  listen 8080;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location = /metrics { return 403; }
  location = /login {
   limit_req zone=login burst=5 nodelay;
   proxy_pass http://clinic;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
   proxy_pass http://clinic;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
  }
 }
 server {
  listen 8081;
  access_log off;
  location = /stub_status { stub_status; }
  location / { return 404; }
 }
}
